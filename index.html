<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jacklight Tales — magical stories and woodland adventures are coming soon.">
  <meta name="theme-color" content="#183625">
  <link rel="icon" type="image/png" href="jlt-favicon.png">
  <title>Jacklight Tales — Coming Soon</title>
  <style>
    :root{color-scheme:dark;--cream:#fff5d6;--gold:#f4cc61;--forest:#183625}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100svh;overflow:hidden;background:var(--forest);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
    .page{position:relative;isolation:isolate;min-height:100svh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);align-items:center;padding:clamp(24px,4vw,68px) clamp(24px,7vw,112px)}
    .page::before{content:"";position:absolute;inset:0;z-index:-3;background:url("home-hero-desktop.png") center/cover no-repeat}
    .page::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(8,28,18,.91) 0%,rgba(12,35,22,.69) 42%,rgba(14,37,23,.16) 72%),linear-gradient(0deg,rgba(7,22,14,.58),transparent 54%)}
    .brand{position:absolute;top:clamp(20px,4vw,48px);left:clamp(22px,5vw,72px);display:flex;align-items:center;gap:12px;font:700 clamp(12px,1.2vw,15px)/1 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;text-shadow:0 2px 10px #000}
    .brand img{width:clamp(45px,5vw,70px);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
    .copy{max-width:650px;padding-top:54px;text-shadow:0 3px 22px rgba(0,0,0,.72)}
    .eyebrow{margin:0 0 18px;color:var(--gold);font:700 12px/1.4 Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(58px,8vw,118px);font-weight:400;line-height:.88;letter-spacing:-.055em}
    h1 span{display:block;color:var(--gold);font-size:.52em;line-height:1.25;letter-spacing:.04em}
    .rule{width:60px;height:2px;margin:28px 0;background:var(--gold);box-shadow:0 0 16px rgba(244,204,97,.45)}
    .message{max-width:520px;margin:0;color:#fff9e8;font:clamp(17px,1.55vw,22px)/1.55 Arial,sans-serif}
    .character{align-self:end;justify-self:center;width:min(42vw,620px);max-height:88svh;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 18px 25px rgba(0,0,0,.38));z-index:-1}
    footer{position:absolute;left:clamp(22px,5vw,72px);bottom:22px;color:rgba(255,245,214,.72);font:10px/1.4 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
    .sound-toggle{position:absolute;right:clamp(22px,5vw,72px);bottom:18px;z-index:2;padding:10px 14px;border:1px solid rgba(255,245,214,.5);border-radius:999px;background:rgba(7,22,14,.64);color:var(--cream);font:700 11px/1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s}
    .sound-toggle:hover,.sound-toggle[aria-pressed="true"]{border-color:var(--gold);background:rgba(20,50,29,.82)}

    @media(max-width:760px){
      html,body{height:100%}
      body{overflow:hidden}
      .page{height:100svh;min-height:100svh;display:block;padding:0 20px;text-align:center;overflow:hidden}
      .page::before{background-position:48% center}
      .page::after{background:linear-gradient(180deg,rgba(7,25,15,.84) 0%,rgba(9,29,18,.53) 48%,rgba(7,23,14,.88) 100%)}
      .brand{top:18px;left:50%;transform:translateX(-50%);gap:10px;white-space:nowrap;font-size:11px;letter-spacing:.2em}
      .brand img{width:42px}
      .copy{position:relative;z-index:2;max-width:350px;margin:0 auto;padding:clamp(118px,18svh,150px) 0 0}
      .eyebrow{margin-bottom:10px;font-size:10px;letter-spacing:.24em}
      h1{font-size:clamp(46px,14vw,64px);line-height:.86}
      h1 span{font-size:.5em;line-height:1.15}
      .rule{width:52px;margin:14px auto}
      .message{max-width:330px;margin:0 auto;font-size:14px;line-height:1.38}
      .character{position:absolute;z-index:1;left:50%;bottom:max(-4px,env(safe-area-inset-bottom));transform:translateX(-50%);width:auto;height:min(39svh,330px);max-width:78vw;max-height:none;margin:0;object-fit:contain;object-position:center bottom}
      footer{display:none}
      .sound-toggle{right:18px;bottom:max(18px,env(safe-area-inset-bottom));font-size:10px}
    }

    @media(max-width:760px) and (max-height:720px){
      .copy{padding-top:92px}
      .eyebrow{font-size:9px;margin-bottom:8px}
      h1{font-size:clamp(42px,13vw,56px)}
      .rule{margin:10px auto}
      .message{font-size:13px;line-height:1.32;max-width:310px}
      .character{height:min(34svh,250px);max-width:72vw}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand"><img src="jlt-favicon.png" alt=""><span>Jacklight Tales</span></div>
    <section class="copy" aria-labelledby="title">
      <p class="eyebrow">A little magic is on its way</p>
      <h1 id="title">Coming <span>Soon</span></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="message">Barnaby is getting the woodland ready for stories, adventures and a touch of lantern light.</p>
    </section>
    <img class="character" src="barnaby.png" alt="Barnaby the fox, ready for a woodland adventure">
    <footer>jacklighttales.com</footer>
    <audio id="woodland-music" preload="auto" loop playsinline aria-hidden="true">
      <source src="https://pub-9ea739df2a0c435bbc605d2f4bfc6fb5.r2.dev/Website%20-%20Jingles/Morning_in_the_Clearing.mp3" type="audio/mpeg">
    </audio>
    <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" aria-label="Turn woodland sound on">♫ Sound on</button>
  </main>
  <script>
    (() => {
      const music = document.getElementById("woodland-music");
      const toggle = document.getElementById("sound-toggle");
      music.volume = 0.04;

      function updateToggle() {
        const isPlaying = !music.paused;
        toggle.setAttribute("aria-pressed", String(isPlaying));
        toggle.setAttribute("aria-label", isPlaying ? "Turn woodland sound off" : "Turn woodland sound on");
        toggle.textContent = isPlaying ? "♫ Sound off" : "♫ Sound on";
      }

      async function startMusic() {
        try {
          await music.play();
        } catch {}
        updateToggle();
      }

      toggle.addEventListener("click", async () => {
        if (music.paused) await startMusic();
        else music.pause();
      });
      music.addEventListener("play", updateToggle);
      music.addEventListener("pause", updateToggle);

      startMusic();
      document.addEventListener("pointerdown", event => {
        if (!event.target.closest("#sound-toggle")) startMusic();
      }, { once: true, capture: true });
    })();
  </script>
</body>
</html>
